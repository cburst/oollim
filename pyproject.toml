[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "oollim"
version = "0.3.0"
description = "Reproducible frozen speech representations and corpus-weighted ridge assessment"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
authors = [{name = "Richard Rose", email = "richard.rose@hufs.ac.kr"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "threadpoolctl>=3"]
[project.optional-dependencies]
test = ["pytest>=8", "rich>=13", "tqdm>=4"]
gui = ["PySide6==6.10.1", "nltk==3.9.2", "pypdf==6.1.3", "weasyprint==70.0; platform_system != 'Windows'"]
evaluation = ["pandas>=2", "scikit-learn>=1.4"]
encoders = ["torch>=2.6", "torchaudio>=2.6", "transformers>=4.48", "safetensors", "soundfile", "pyyaml", "typeguard", "einops", "torch-complex", "humanfriendly"]
[tool.setuptools]
packages = ["reproduce", "evaluation"]
[tool.pytest.ini_options]
testpaths = ["tests"]
